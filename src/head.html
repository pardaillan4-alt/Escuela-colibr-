<title>Escuelita Colibrí</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@500;700;800&display=swap">
<style>
/* Layout: cuaderno de cuadrícula. Barra fija arriba, columna central de 980px, cada lección es una hoja con margen rojo. Modo oscuro = pizarrón verde. */
:root{
--paper:#eef4fa;--grid:#dbe7f2;--card:#ffffff;--ink:#1b2a44;--soft:#55657f;--line:#cad8e6;--chip:#e8f0f8;--margin:#e98b8b;
--sun:#f5a524;--ok:#1d8f4e;--okbg:#e2f5e9;--bad:#cf3346;--badbg:#fde7ea;--rev:#8a5a00;--revbg:#fff3d6;
--mat:#2463c8;--mat-s:#dfe9fb;--esp:#d2383f;--esp-s:#fbe2e3;--cie:#1d8c5c;--cie-s:#dcf2e6;--his:#c95f0e;--his-s:#fde9d7;
--civ:#6f45c0;--civ-s:#ebe3fa;--rel:#9c7305;--rel-s:#f7edcc;--com:#1a7fa3;--com-s:#d8eff7;--ing:#c23b6b;--ing-s:#fbe1ea;--art:#d0611c;--art-s:#fde6d6;--ef:#2f8a3a;--ef-s:#dcf3de;--lec:#3a5bc7;--lec-s:#e0e7fb;--tra:#8a4fb5;--tra-s:#efe2f8;--ora:#b0466e;--ora-s:#f9e1ea;
--display:"Grandstander","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
--body:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;
--sc:var(--mat);--ss:var(--mat-s);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--paper:#15231e;--grid:#1c2e27;--card:#1e3129;--ink:#eef4ec;--soft:#a8bcb0;--line:#34503f;--chip:#273f35;--margin:#b05b5b;
--sun:#ffc53d;--ok:#5fd08f;--okbg:#1b3c2a;--bad:#ff8090;--badbg:#45222a;--rev:#ffd27a;--revbg:#3d321a;
--mat:#86adff;--mat-s:#22365c;--esp:#ff8a8f;--esp-s:#4a2629;--cie:#63d39f;--cie-s:#1c4232;--his:#ffab66;--his-s:#4a3020;
--civ:#bba0ff;--civ-s:#352a58;--rel:#f0c95a;--rel-s:#45391a;--com:#64cdee;--com-s:#173f4d;--ing:#ff86b0;--ing-s:#4a1d2e;--art:#ffa46a;--art-s:#4a2a14;--ef:#7fd88a;--ef-s:#1d3f22;--lec:#93a9ff;--lec-s:#1f2a52;--tra:#d3a2f5;--tra-s:#3a2350;--ora:#f39abb;--ora-s:#4a2032;color-scheme:dark}}
:root[data-theme="dark"]{
--paper:#15231e;--grid:#1c2e27;--card:#1e3129;--ink:#eef4ec;--soft:#a8bcb0;--line:#34503f;--chip:#273f35;--margin:#b05b5b;
--sun:#ffc53d;--ok:#5fd08f;--okbg:#1b3c2a;--bad:#ff8090;--badbg:#45222a;--rev:#ffd27a;--revbg:#3d321a;
--mat:#86adff;--mat-s:#22365c;--esp:#ff8a8f;--esp-s:#4a2629;--cie:#63d39f;--cie-s:#1c4232;--his:#ffab66;--his-s:#4a3020;
--civ:#bba0ff;--civ-s:#352a58;--rel:#f0c95a;--rel-s:#45391a;--com:#64cdee;--com-s:#173f4d;--ing:#ff86b0;--ing-s:#4a1d2e;--art:#ffa46a;--art-s:#4a2a14;--ef:#7fd88a;--ef-s:#1d3f22;--lec:#93a9ff;--lec-s:#1f2a52;--tra:#d3a2f5;--tra-s:#3a2350;--ora:#f39abb;--ora-s:#4a2032;color-scheme:dark}

body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0;font-weight:800}
h1{font-size:clamp(28px,6vw,40px)}h2{font-size:24px}h3{font-size:20px}
p{margin:0}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.eyebrow{font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.lead{font-size:19px;color:var(--soft);max-width:60ch}

#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--card);border-bottom:2px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:6px;font:800 21px var(--display);background:none;border:0;cursor:pointer;padding:0;color:var(--ink)}
.brand .bird{width:48px;height:40px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 12px;font:700 15px var(--body);cursor:pointer;min-height:40px;color:var(--ink)}
.pill.static{cursor:default}
.pill svg{width:20px;height:20px;flex:none}
.pill[aria-pressed="false"]{opacity:.65}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
@media (max-width:560px){.bname,.vtxt{display:none}.topin{gap:6px;flex-wrap:nowrap}.pill{padding:5px 10px;font-size:14px}}

main{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 90px;display:flex;flex-direction:column;gap:18px}
.sec{margin-top:10px}

.btn{--b:var(--sc);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:14px;border:0;background:var(--b);color:var(--card);font:800 18px/1.1 var(--display);cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--b) 62%,#000);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--b) 62%,#000)}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--card);color:var(--sc);border:2px solid var(--sc);box-shadow:0 4px 0 var(--line)}
.btn.warn{--b:var(--bad)}
.btn.big{font-size:22px;min-height:58px;padding-inline:28px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--soft);font:700 16px var(--body);cursor:pointer;padding:6px 0;align-self:flex-start;min-height:40px}
.back svg{width:18px;height:18px}

/* Inicio */
.hello{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px}
.hello-t{display:flex;flex-direction:column;gap:8px;min-width:0}
.hello-b{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:220px}
.bubble{background:var(--chip);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:15px;position:relative;text-align:center}
.bubble::after{content:"";position:absolute;bottom:-9px;left:50%;width:14px;height:14px;background:var(--chip);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bird.big{width:150px;height:125px}
.bird.sm{width:56px;height:47px;flex:none}
.lvl{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-width:360px}
.lvl small{color:var(--soft);font-size:14px}
.lbar{height:12px;border-radius:99px;background:var(--chip);overflow:hidden;border:1px solid var(--line)}
.lbar i{display:block;height:100%;background:var(--sun);border-radius:99px}
@media (max-width:620px){.hello{grid-template-columns:1fr}.hello-b{flex-direction:row;max-width:none;justify-content:space-between}.hello-b .bird.big{width:110px;height:92px}.bubble::after{display:none}}

.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pcard{background:var(--ss);border:2px solid var(--sc);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.pc-h{display:flex;align-items:center;gap:8px;font:800 17px var(--display);color:var(--sc)}
.pc-h .sic{width:34px;height:34px}
.pc-l{font-size:19px;font-weight:700;flex:1}

.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-3px);border-color:var(--sc)}
.tile h3{color:var(--sc)}
.tile p{font-size:15px;color:var(--soft);flex:1}
.sic{width:52px;height:52px;border-radius:14px;background:var(--ss);color:var(--sc);display:grid;place-items:center;flex:none}
.sic svg{width:62%;height:62%}
.pencil{display:flex;align-items:center;height:16px;width:100%}
.pencil .pb{flex:1;height:100%;background:var(--chip);border:1px solid var(--line);border-right:0;border-radius:5px 0 0 5px;overflow:hidden}
.pencil .pb i{display:block;height:100%;background:var(--sc)}
.pencil .tip{width:20px;height:100%;background:linear-gradient(90deg,#e7c08a 62%,var(--sc) 62%);clip-path:polygon(0 0,100% 50%,0 100%)}
.pmeta{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}

.reto{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--card);border:2px dashed var(--mat);border-radius:18px;padding:16px 18px}
.reto p{color:var(--soft)}

/* Materia */
.sband{display:flex;gap:16px;align-items:flex-start;background:var(--ss);border-radius:22px;padding:22px}
.sband h1{color:var(--sc)}
.sband>div{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.sband .sic{width:68px;height:68px;background:var(--card)}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lrow{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;min-height:64px}
.lrow:hover{border-color:var(--sc)}
.lrow .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 18px var(--display);border:3px solid var(--sc);color:var(--sc);flex:none;font-variant-numeric:tabular-nums}
.lrow.done .num{background:var(--sc);color:var(--card)}
.lrow.cur{border-color:var(--sc);box-shadow:0 0 0 3px var(--ss)}
.lrow .lt{flex:1;font-weight:700;font-size:18px;display:flex;flex-direction:column;min-width:0}
.lrow .lt em{font-style:normal;font-size:13px;color:var(--sc);font-family:var(--display)}
.st{display:flex;gap:2px;flex:none}
.st svg{width:22px;height:22px}

/* Lección */
.lhead{display:flex;flex-direction:column;gap:6px}
.lhead h1{color:var(--sc)}
.pdots{display:flex;gap:6px;margin-top:4px}
.pdots i{width:28px;height:8px;border-radius:9px;background:var(--line)}
.pdots i.past{background:var(--ss)}
.pdots i.on{background:var(--sc)}
.lcard,.ecard{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding-block:20px 24px;padding-inline:40px 22px;display:flex;flex-direction:column;gap:14px}
.lcard::before,.ecard::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
.lc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lc-top h2{flex:1;min-width:0}
.q{font-size:clamp(22px,4.6vw,27px)}
.ltext{font-size:21px;line-height:1.6;max-width:62ch}
.ltext b{color:var(--sc)}
.spk{display:inline-flex;align-items:center;gap:6px;background:var(--ss);color:var(--sc);border:2px solid var(--sc);border-radius:999px;padding:6px 14px;font:700 15px var(--body);cursor:pointer;min-height:42px;flex:none}
.spk svg{width:20px;height:20px}
.lnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vis{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:14px;max-width:100%;overflow-x:auto;padding-block:4px}

/* Visuales */
.frames{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,42px);grid-auto-rows:42px;border:2px solid var(--sc);border-radius:10px;overflow:hidden;background:var(--card)}
.cell{display:grid;place-items:center;border-right:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.cell:nth-child(5n){border-right:0}.cell:nth-child(n+6){border-bottom:0}
.grp{display:flex;flex-wrap:wrap;gap:4px;max-width:220px;justify-content:center;padding:8px;border:2px dashed var(--line);border-radius:14px}
.eq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.op{font:800 40px var(--display);color:var(--sc)}
.ico{position:relative;display:inline-block;line-height:0}
.ico.gone>svg:first-child{opacity:.35}
.ico .x{position:absolute;inset:0;width:100%;height:100%}
.blocks{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.rods{display:flex;gap:5px}
.units{display:flex;flex-direction:column-reverse;flex-wrap:wrap;max-height:102px;gap:2px}
.unit rect{fill:var(--mat-s);stroke:var(--mat);stroke-width:2}
.rod rect{fill:var(--esp-s);stroke:var(--esp);stroke-width:2}
.clock .face{fill:var(--card);stroke:var(--sc);stroke-width:5}
.clock text{fill:var(--ink);font:700 15px var(--body)}
.clock .hh{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.clock .mh{stroke:var(--sc);stroke-width:4;stroke-linecap:round}
.clock .pin{fill:var(--ink)}
.coins{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.shape .shp{fill:var(--ss);stroke:var(--sc);stroke-width:3;stroke-linejoin:round}
.shape .shp.t{fill:var(--card)}
.shape .shp.s{fill:var(--sc);fill-opacity:.35}
.shape .ln{stroke:var(--sc);stroke-width:2;stroke-dasharray:4 4;fill:none}
.shape .hl{fill:var(--card);opacity:.7}
.shapes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.shapes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}
.shapes .shape{width:104px;height:87px}
.nline{max-width:360px;width:100%;height:auto}
.nline line{stroke:var(--ink);stroke-width:2}
.nline text{fill:var(--ink);font:700 12px var(--body)}
.nline .mk{fill:var(--sc)}
.seq{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seq span{min-width:46px;height:46px;padding:0 6px;border-radius:10px;border:2px solid var(--sc);display:grid;place-items:center;font:800 20px var(--display);background:var(--card);font-variant-numeric:tabular-nums}
.seq span.q{background:var(--sun);border-color:var(--sun);color:#1b2a44}
.bigt{font:700 clamp(38px,9vw,68px)/1.2 var(--body);color:var(--sc);text-align:center;letter-spacing:.04em;word-break:break-word}
.syl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.syl span{background:var(--ss);color:var(--ink);border:2px solid var(--sc);border-radius:12px;padding:6px 14px;font:700 22px var(--body)}
.word{display:flex;gap:4px;font:700 46px var(--body)}
.word span{padding:0 6px;border-radius:10px}
.word .w0{background:var(--ss);color:var(--sc)}
.word .w1{color:var(--ink)}
.emo{font-size:clamp(44px,11vw,64px);line-height:1.2;text-align:center;letter-spacing:.06em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;width:100%}
.mini{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--ss);border-radius:14px;padding:10px 8px;text-align:center;font-weight:700;font-size:16px}
.mini .mi{font-size:36px;line-height:1.1;font-family:var(--display);color:var(--sc)}
.pict{display:flex;flex-direction:column;gap:6px;width:100%;max-width:440px}
.prw{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.prw .pl{font-weight:700;font-size:16px}
.prw .pi{font-size:28px;letter-spacing:.08em}
.pray{margin:0;background:var(--ss);border-radius:16px;padding:16px 20px;font-size:20px;line-height:1.65;max-width:60ch;color:var(--ink);font-style:italic}
.steps{margin:0;padding-left:30px;display:flex;flex-direction:column;gap:6px;font-size:19px;max-width:60ch;text-align:left;align-self:stretch}
.steps li::marker{font:800 19px var(--display);color:var(--sc)}
.vert{border-collapse:collapse;font:800 34px var(--display);font-variant-numeric:tabular-nums}
.vert th{font:700 14px var(--body);color:var(--sc)}
.vert td,.vert th{width:44px;text-align:center;padding:2px 4px}
.vert tr.res td{border-top:3px solid var(--ink)}

/* Práctica */
.phead{display:flex;align-items:center;gap:12px}
.phead .back{padding:6px}
.pbar{flex:1;height:16px;background:var(--card);border:2px solid var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--sc);border-radius:99px;transition:width .3s}
.pcount{font:800 16px var(--display);color:var(--soft);font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opts.short{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.opt{min-height:62px;padding:10px 14px;border-radius:16px;border:3px solid var(--line);background:var(--card);font:700 21px/1.25 var(--body);cursor:pointer;box-shadow:0 4px 0 var(--line);text-align:center}
.opts.short .opt{font:800 30px var(--display)}
.opt:hover:not(:disabled){border-color:var(--sc)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink);box-shadow:0 4px 0 var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);opacity:.75;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.numwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.numbox{min-width:130px;min-height:64px;border:3px solid var(--sc);border-radius:16px;display:grid;place-items:center;font:800 40px var(--display);background:var(--ss);padding:0 16px;font-variant-numeric:tabular-nums}
.numbox.ok{border-color:var(--ok);background:var(--okbg)}
.numbox.rev{border-color:var(--rev);background:var(--revbg)}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:10px}
.key{height:62px;border-radius:14px;border:2px solid var(--line);background:var(--card);font:800 28px var(--display);cursor:pointer;box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.alt{font-size:22px;color:var(--soft)}
.key.go{background:var(--ok);color:var(--card);border-color:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.built{min-height:66px;border:3px dashed var(--sc);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--ss)}
.built.word{justify-content:center}
.built .ph{color:var(--soft);font-size:16px;padding:0 6px}
.arrow{color:var(--sc);font-weight:800}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile2{min-height:52px;padding:8px 16px;border-radius:14px;border:2px solid var(--sc);background:var(--card);font:700 21px var(--body);cursor:pointer;box-shadow:0 4px 0 var(--line)}
.tile2.in{background:var(--card);border-style:solid}
.tile2:disabled{opacity:.25;cursor:default}
.sort{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--card)}
.srow.bad{border-color:var(--bad);background:var(--badbg)}
.sit{font-weight:700;font-size:20px;min-width:0}
.sg{display:flex;gap:6px;flex-wrap:wrap}
.gbtn{min-height:44px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--chip);font:700 15px var(--body);cursor:pointer}
.gbtn.on{background:var(--sc);color:var(--card);border-color:var(--sc)}
