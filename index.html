L("2h2","Los puntos cardinales",[
P("Norte, sur, este y oeste","Los <b>puntos cardinales</b> nos ayudan a ubicarnos: <b>norte</b>, <b>sur</b>, <b>este</b> (oriente) y <b>oeste</b> (poniente). La rosa de los vientos los muestra.",{t:"compass"}),
P("El sol nos guía","El sol sale por el <b>este</b> (oriente) y se oculta por el <b>oeste</b> (poniente). Si extiendes tu brazo derecho hacia donde sale el sol, tienes el norte enfrente.",{t:"emo",x:"🌅🌇"}),
P("Norte y sur de México","En el <b>norte</b> de México están Chihuahua, Sonora y Nuevo León. En el <b>sur</b>, Oaxaca y Chiapas. En el <b>este</b>, Veracruz y la península de Yucatán.",{t:"emo",x:"🗺️"}),
F("Mirando al oriente","Muchas iglesias antiguas se construían con el altar hacia el <b>oriente</b>, por donde sale el sol, porque Jesús resucitado es el «Sol que nace de lo alto». Los Magos vinieron también de Oriente siguiendo la estrella.",{t:"compass"})
],[C("¿Por dónde sale el sol?",["Por el este","Por el oeste","Por el sur"]),C("¿Por dónde se oculta el sol?",["Por el oeste","Por el este","Por el norte"]),N("¿Cuántos puntos cardinales hay?",4),C("¿Otro nombre del este?",["Oriente","Poniente","Norte"]),C("¿Qué estado está en el norte de México?",["Chihuahua","Chiapas","Oaxaca"]),C("¿De dónde vinieron los Magos?",["De Oriente","Del Polo Norte","De América"])]),
L("2h3","Mapas y planos",[
P("¿Qué es un mapa?","Un <b>mapa</b> es un dibujo de un lugar visto desde arriba. Usa <b>símbolos</b>: una cruz para la iglesia, una casita para la escuela, líneas azules para los ríos.",{t:"cards",x:[["⛪","iglesia"],["🏫","escuela"],["🌳","parque"],["🏥","hospital"]]}),
P("La simbología","La <b>simbología</b> es un cuadro que explica qué significa cada símbolo del mapa. Siempre léela antes de usar un mapa.",{t:"emo",x:"🗺️🔑"}),
F("Los mapas de las misiones","Los misioneros hicieron muchos de los primeros mapas de México mientras caminaban de pueblo en pueblo. En los mapas de nuestras ciudades se ve que casi todas tienen una <b>plaza</b> con su iglesia en el centro.",{t:"emo",x:"⛪🗺️"})
],[C("¿Cómo se ve un lugar en un mapa?",["Desde arriba","De lado","De abajo"]),C("¿Qué explica la simbología?",["Qué significa cada símbolo","La hora","El clima"]),C("¿Qué color se usa para los ríos?",["Azul","Rojo","Negro"]),C("¿Qué hay en el centro de muchas ciudades de México?",["Una plaza con su iglesia","Un aeropuerto","Una mina"]),TF("Un mapa es un dibujo de un lugar visto desde arriba.",true)]),
L("2h4","El trabajo y los productos",[
P("Del campo a tu mesa","Antes de llegar a tu mesa, la tortilla pasó por muchas manos: el <b>campesino</b> sembró el maíz, alguien lo transportó, en el molino lo hicieron masa y en la tortillería, tortillas.",{t:"steps",x:["Campesino siembra el maíz","Se cosecha y se transporta","Se hace masa en el molino","La tortillería hace tortillas"]}),
P("Productos de México","Cada región produce cosas: café en Veracruz y Chiapas, aguacate en Michoacán, plata en Zacatecas, tequila en Jalisco, ganado en el norte.",{t:"cards",x:[["☕","café"],["🥑","aguacate"],["🪙","plata"],["🐄","ganado"]]}),
F("San José Obrero","San José era <b>carpintero</b> y Jesús aprendió de él el oficio. El trabajo bien hecho es una forma de santificarnos y servir. El <b>1 de mayo</b> celebramos a San José Obrero, patrono de los trabajadores.",{t:"emo",x:"🪚🪵"})
],[O("Ordena cómo llega la tortilla a tu mesa",["Siembra del maíz","Cosecha","Molino","Tortillería"]),C("¿Qué se produce mucho en Michoacán?",["Aguacate","Petróleo","Nieve"]),C("¿Qué oficio tenía San José?",["Carpintero","Pescador","Médico"]),C("¿Cuándo celebramos a San José Obrero?",["1 de mayo","25 de diciembre","16 de septiembre"]),TF("El trabajo bien hecho es una forma de servir a Dios.",true)])
]},
{t:"México en la historia",ls:[
L("2h5","Los pueblos antiguos de México",[
P("Antes de la llegada de los españoles","En lo que hoy es México vivían muchos pueblos: <b>olmecas</b>, <b>mayas</b>, <b>zapotecos</b>, <b>mexicas</b> y otros. Construyeron pirámides, ciudades y calendarios.",{t:"emo",x:"🛕🌽"}),
P("Los mayas","Los <b>mayas</b> vivieron en el sureste: Yucatán, Chiapas, Campeche. Eran grandes astrónomos y matemáticos, y usaban el número <b>cero</b>. Construyeron Chichén Itzá y Palenque.",{t:"emo",x:"🛕✨"}),
P("Los mexicas","Los <b>mexicas</b> fundaron <b>México-Tenochtitlan</b> en un islote del lago de Texcoco, donde vieron un águila sobre un nopal. Hoy ahí está la Ciudad de México. Sembraban en <b>chinampas</b>.",{t:"emo",x:"🦅🌵🛶"}),
F("Lo bueno de cada pueblo","Los pueblos antiguos buscaban a Dios aunque no lo conocían plenamente. La Iglesia enseña que en las culturas hay «semillas del Verbo»: cosas buenas que preparan para conocer a Jesús. Pero también había cosas malas, como los sacrificios humanos, que el Evangelio vino a terminar.",{t:"emo",x:"🌱✝️"})
],[C("¿Dónde vivieron los mayas?",["En el sureste de México","En el Polo Norte","En Europa"]),C("¿Qué ciudad fundaron los mexicas?",["México-Tenochtitlan","Monterrey","Guadalajara"]),C("¿Qué señal vieron los mexicas?",["Un águila sobre un nopal","Un león en una roca","Un pez en un árbol"]),C("¿Cómo se llamaban los huertos en el lago?",["Chinampas","Haciendas","Ranchos"]),C("¿Qué número usaban los mayas antes que muchos pueblos?",["El cero","El mil","El cien"]),C("¿Qué buscaban los pueblos antiguos aunque no lo conocían plenamente?",["A Dios","Dinero","Petróleo"])]),
L("2h6","La evangelización y el mestizaje",[
P("El encuentro de dos mundos","En <b>1521</b> los españoles conquistaron Tenochtitlan. Fue un tiempo de guerra y de mucho sufrimiento. De ese encuentro nació un pueblo nuevo, <b>mestizo</b>: con sangre, costumbres y palabras indígenas y españolas.",{t:"emo",x:"🤝"}),
P("Los misioneros","Llegaron frailes como los <b>doce franciscanos</b> de 1524. Aprendieron náhuatl y otras lenguas, defendieron a los indígenas, fundaron escuelas, hospitales y pueblos. <b>Fray Bartolomé de las Casas</b> luchó por los derechos de los indígenas.",{t:"emo",x:"⛪📚"}),
F("Guadalupe une a México","Diez años después de la conquista, en 1531, la Virgen se apareció a <b>Juan Diego</b>, un indígena, y le habló en su lengua. Su imagen tiene rasgos mestizos y símbolos que los indígenas entendían. Millones de personas se hicieron cristianas, y ella se volvió Madre de todos los mexicanos.",{t:"emo",x:"🌹💙"})
],[C("¿Cuántos frailes franciscanos llegaron en 1524?",["Doce","Dos","Cien"]),C("¿Qué defendía Fray Bartolomé de las Casas?",["Los derechos de los indígenas","Las guerras","Los impuestos"]),C("¿Qué es un pueblo mestizo?",["Uno que mezcla culturas indígenas y españolas","Uno que solo habla inglés","Uno que vive en el mar"]),C("¿En qué año se apareció la Virgen de Guadalupe?",["1531","1810","1910"]),C("¿En qué lengua le habló la Virgen a Juan Diego?",["En su lengua, el náhuatl","En inglés","En latín"]),TF("Los misioneros fundaron escuelas y hospitales.",true)]),
L("2h7","La Independencia de México",[
P("Tres siglos de virreinato","Durante 300 años México fue la <b>Nueva España</b> y dependía del rey de España. Muchos querían que México fuera libre y se gobernara a sí mismo.",{t:"emo",x:"👑"}),
P("Los héroes","La madrugada del <b>16 de septiembre de 1810</b>, el cura <b>Miguel Hidalgo</b> llamó al pueblo de Dolores. Lo ayudaron <b>Ignacio Allende</b> y <b>Josefa Ortiz de Domínguez</b>, la Corregidora. Después el sacerdote <b>José María Morelos</b> continuó la lucha.",{t:"cards",x:[["🔔","Hidalgo"],["⚔️","Allende"],["👩","La Corregidora"],["📜","Morelos"]]}),
P("La consumación","Después de 11 años de lucha, en <b>1821</b> entró a la Ciudad de México el Ejército Trigarante. México fue independiente.",{t:"tline",x:[["1810","Grito de Dolores"],["1821","Consumación de la Independencia"]]}),
F("Religión, Unión e Independencia","El Ejército Trigarante llevaba una bandera de tres colores con tres garantías: <b>Religión</b> (la fe católica), <b>Unión</b> (entre todos los habitantes) e <b>Independencia</b>. Hidalgo y Morelos eran sacerdotes, y Morelos firmaba como «Siervo de la Nación».",{t:"flag"})
],[C("¿En qué año empezó la Independencia?",["1810","1521","1910"]),C("¿En qué año se consumó la Independencia?",["1821","1810","1900"]),C("¿Quién fue la Corregidora?",["Josefa Ortiz de Domínguez","Sor Juana","La Malinche"]),C("¿Qué eran Hidalgo y Morelos?",["Sacerdotes","Reyes","Marineros"]),C("¿Cuáles eran las tres garantías?",["Religión, Unión e Independencia","Oro, plata y cobre","Norte, sur y este"]),C("¿Cómo firmaba Morelos?",["Siervo de la Nación","Rey de México","Señor Presidente"]),N("¿Cuántos años duró la lucha de Independencia?",11)]),

P("5 de mayo: Batalla de Puebla","En <b>1862</b>, el ejército mexicano, dirigido por <b>Ignacio Zaragoza</b>, venció al ejército francés en Puebla.",{t:"emo",x:"🎖️"}),

F("Rezar por la patria","Un buen cristiano es también un buen ciudadano: respeta las leyes justas, trabaja por el bien de todos y <b>reza por su país</b> y por quienes lo gobiernan, como pide San Pablo.",{t:"emo",x:"🇲🇽🙏"})
],[C("¿Qué celebramos el 5 de mayo?",["La Batalla de Puebla","La Navidad","La Independencia"]),C("¿Quién dirigió al ejército en la Batalla de Puebla?",["Ignacio Zaragoza","Miguel Hidalgo","Benito Juárez"]),C("¿Qué celebramos el 5 de febrero?",["La Constitución","El Día de Reyes","La Revolución"]),C("¿Qué defendieron los Niños Héroes?",["El Castillo de Chapultepec","Una iglesia","Un barco"]),O("Ordena por fecha del año",["5 de febrero","5 de mayo","13 de septiembre","16 de septiembre","20 de noviembre"]),C("San Pablo pide rezar por...",["Quienes nos gobiernan","Nadie","Solo por uno mismo"])]),
L("2h9","Fiestas patronales y peregrinaciones",[

P("Peregrinaciones","Una <b>peregrinación</b> es un viaje a un lugar santo para rezar. Cada año millones caminan a la <b>Basílica de Guadalupe</b>; también a San Juan de los Lagos, Zapopan o Talpa.",{t:"emo",x:"🚶🚶🚶⛪"}),
F("La Iglesia peregrina","Toda la vida cristiana es como una peregrinación: vamos caminando juntos hacia el cielo, la casa del Padre. Las fiestas y peregrinaciones nos recuerdan que no caminamos solos.",{t:"emo",x:"🛤️☁️"})
],[C("¿Qué es una peregrinación?",["Un viaje a un lugar santo para rezar","Un concurso","Un partido"]),C("¿A qué santuario peregrinan más personas en México?",["La Basílica de Guadalupe","Un estadio","Un museo"]),C("¿Qué es el santo patrono?",["El santo protector de un pueblo o persona","Un jefe","Un deportista"]),C("¿Hacia dónde caminamos los cristianos?",["Hacia el cielo, la casa del Padre","Hacia la playa","Hacia ningún lado"]),TF("En las fiestas patronales hay Misa y procesión.",true)])
]}

{t:"Crecer como persona",ls:[
L("2v1","Mi dignidad",[
P("¿Qué es la dignidad?","La <b>dignidad</b> es el valor que tiene cada persona por ser persona. No depende de lo que tiene, de cómo se ve ni de lo que sabe hacer.",{t:"emo",x:"👧🏻🧒🏽👦🏿👵🏼"}),
P("Me cuido y me respeto","Respetar mi dignidad es cuidar mi cuerpo, decir que no cuando algo está mal y no dejar que nadie me humille. Y respetar la de los demás es nunca burlarme ni lastimar.",{t:"emo",x:"🛡️🤝"}),
F("Imagen de Dios","Nuestra dignidad es tan grande porque Dios nos creó <b>a su imagen y semejanza</b> y Jesús dio su vida por cada uno. Por eso toda vida es sagrada: la del bebé que no ha nacido, la del enfermo y la del anciano.",{t:"emo",x:"✨"})
],[C("¿De qué depende la dignidad de una persona?",["De ser persona","De tener dinero","De ser famoso"]),C("¿Por qué nuestra dignidad es tan grande?",["Porque Dios nos creó a su imagen","Porque somos fuertes","Porque tenemos celular"]),TF("Un anciano enfermo tiene la misma dignidad que un niño sano.",true),C("Un compañero se burla de otro por su ropa. ¿Qué haces?",["Le digo que no está bien y acompaño al otro","Me río también","Le tomo foto"]),TF("Toda vida humana es sagrada.",true)]),
L("2v2","Regulo mis emociones",[
P("Sentir no es lo mismo que actuar","Todas las emociones son válidas, pero no todas las acciones lo son. Puedo estar enojado sin pegar, o triste sin encerrarme. A esto se le llama <b>autorregulación</b>.",{t:"cards",x:[["😠","siento enojo"],["🧘","respiro y hablo"]]}),
P("El semáforo","🔴 <b>Alto</b>: me detengo. 🟡 <b>Pienso</b>: ¿qué siento?, ¿qué puedo hacer? 🟢 <b>Actúo</b>: elijo la mejor opción.",{t:"emo",x:"🔴🟡🟢"}),
F("La mansedumbre","Jesús dijo: «Aprendan de mí, que soy <b>manso</b> y humilde de corazón». La mansedumbre no es debilidad: es dominar el enojo para no lastimar. San Francisco de Sales decía que se atrapan más moscas con una gota de miel que con un barril de vinagre.",{t:"emo",x:"🕊️🍯"})
],[O("Ordena el semáforo de las emociones",["Me detengo","Pienso qué siento","Elijo qué hacer"]),C("Tu hermano rompió tu dibujo. ¿Qué haces?",["Respiro, le digo cómo me siento y busco una solución","Rompo el suyo","Le pego"]),C("Jesús dijo: «Aprendan de mí, que soy ___ y humilde de corazón»",["manso","rápido","rico"]),C("¿Qué es la autorregulación?",["Dominar lo que hago aunque sienta algo fuerte","No sentir nada","Gritar más fuerte"]),TF("Estar enojado me da derecho a pegar.",false)]),
L("2v3","Las virtudes que me hacen fuerte",[
P("Virtudes cardinales","Son cuatro y sostienen a las demás, como las patas de una mesa: <b>prudencia</b>, <b>justicia</b>, <b>fortaleza</b> y <b>templanza</b>.",{t:"cards",x:[["🤔","prudencia"],["⚖️","justicia"],["💪","fortaleza"],["🍬","templanza"]]}),
P("Se aprenden practicando","Las virtudes son como los músculos: se hacen fuertes con práctica. Cada vez que dices la verdad aunque te cueste, se fortalece tu sinceridad.",{t:"emo",x:"🏋️"}),
F("Virtudes teologales","Además hay tres virtudes que Dios pone directamente en el alma con el Bautismo: <b>fe</b>, <b>esperanza</b> y <b>caridad</b>. «La mayor de ellas es la caridad», dice San Pablo.",{t:"cards",x:[["✝️","fe"],["⚓","esperanza"],["❤️","caridad"]]})
],[N("¿Cuántas son las virtudes cardinales?",4),N("¿Cuántas son las virtudes teologales?",3),S2("¿Cardinal o teologal?",["Cardinal","Teologal"],[["prudencia",0],["fe",1],["justicia",0],["esperanza",1],["fortaleza",0],["caridad",1]]),C("Según San Pablo, ¿cuál es la mayor virtud?",["La caridad","La fuerza","La rapidez"]),C("Terminar la tarea aunque estés cansado es...",["Fortaleza","Pereza","Envidia"]),C("¿Cómo se hacen fuertes las virtudes?",["Practicándolas","Comprándolas","Durmiendo"])])
]},
{t:"Convivir con los demás",ls:[
L("2v4","Todos diferentes, todos hermanos",[
P("La diversidad","En México hay personas de muchos pueblos, lenguas, colores de piel, edades y capacidades. Esa variedad se llama <b>diversidad</b> y nos enriquece.",{t:"emo",x:"🧑🏻🧑🏽🧑🏿🧑‍🦽👵"}),
P("No discriminar","<b>Discriminar</b> es tratar mal a alguien por ser diferente. Es injusto. Todos merecemos el mismo trato y las mismas oportunidades.",{t:"emo",x:"🚫"}),
F("El buen samaritano","Los judíos y los samaritanos no se llevaban bien. Pero en la parábola de Jesús, un <b>samaritano</b> fue el único que ayudó al hombre herido en el camino. Jesús nos dijo: «Ve y haz tú lo mismo». Para Jesús, todos somos prójimos.",{t:"emo",x:"🫏🩹"})
],[C("¿Qué es discriminar?",["Tratar mal a alguien por ser diferente","Ayudar a un amigo","Compartir"]),C("¿Quién ayudó al hombre herido en la parábola?",["Un samaritano","Un sacerdote","Un soldado"]),C("¿Qué nos dijo Jesús al final de la parábola?",["«Ve y haz tú lo mismo»","«Quédate en casa»","«No te metas»"]),C("Llega a tu grupo una niña que habla maya. ¿Qué haces?",["La recibo y le pido que me enseñe palabras","La ignoro","Me burlo de cómo habla"]),TF("La diversidad nos enriquece.",true)]),
L("2v5","Decidimos juntos",[
P("Participar","En la familia, el salón o la comunidad hay que tomar decisiones. <b>Participar</b> es dar tu opinión con respeto y escuchar la de los demás.",{t:"emo",x:"🗣️👂"}),
P("Votar","Cuando no todos piensan igual podemos <b>votar</b>: cada persona da su voto y gana la opción que tenga más. Después, todos respetamos lo que se decidió.",{t:"bars",rows:[["Futbol",9],["Escondidas",6],["Avión",4]]}),
F("El bien común","Al decidir, un cristiano no piensa solo en lo que le conviene a él, sino en el <b>bien común</b>: lo que es bueno para todos, especialmente para los más débiles. Los apóstoles también se reunían y oraban para decidir juntos.",{t:"emo",x:"🤝🌍"})
],[C("¿Qué juego ganó la votación?",["Futbol","Escondidas","Avión"],{t:"bars",rows:[["Futbol",9],["Escondidas",6],["Avión",4]]}),N("¿Cuántos niños votaron en total?",19,{t:"bars",rows:[["Futbol",9],["Escondidas",6],["Avión",4]]}),C("¿Qué es el bien común?",["Lo que es bueno para todos","Lo que me conviene solo a mí","Ganar siempre"]),C("Tu opción perdió en la votación. ¿Qué haces?",["Respeto la decisión","Me enojo y no juego","Hago trampa"]),C("¿Qué hacían los apóstoles antes de decidir?",["Se reunían y oraban","Se peleaban","Echaban volados"])]),
L("2v6","Las leyes y la autoridad",[
P("¿Para qué hay leyes?","Las <b>leyes</b> son reglas para todo el país. Protegen nuestros derechos y ayudan a vivir en paz. Las autoridades deben cumplirlas y hacerlas cumplir.",{t:"emo",x:"📜⚖️"}),
P("Autoridades","Tus <b>papás</b> son tu primera autoridad. En la escuela, la maestra y el director; en la comunidad, el presidente municipal; en el país, el presidente de la República.",{t:"steps",x:["Papás","Maestros","Presidente municipal","Gobernador","Presidente de la República"]}),
F("El cuarto mandamiento","El cuarto mandamiento, «Honrarás a tu padre y a tu madre», también nos enseña a <b>respetar a las autoridades</b> legítimas. Jesús dijo: «Den al César lo que es del César y a Dios lo que es de Dios». Pero nunca debemos obedecer algo que vaya contra Dios.",{t:"emo",x:"👨‍👩‍👧⚖️"})
],[C("¿Para qué sirven las leyes?",["Para proteger nuestros derechos y vivir en paz","Para molestar","Para nada"]),C("¿Quiénes son tu primera autoridad?",["Mis papás","Mis amigos","Mi mascota"]),C("¿Qué mandamiento nos enseña a respetar a la autoridad?",["El cuarto","El séptimo","El décimo"]),C("Completa: «Den al César lo que es del César y a ___ lo que es de ___»",["Dios","los ricos","los niños"]),TF("Si alguien me pide hacer algo malo, aunque sea autoridad, no debo obedecer.",true)])
]},
{t:"Cuidarnos y servir",ls:[
L("2v7","Prevenir accidentes",[
